version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    container_name: cloudplatform-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-cloudplatform}
      POSTGRES_USER: ${DATABASE_USERNAME:-app}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-app}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME:-app} -d ${DATABASE_NAME:-cloudplatform}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - cloudplatform

  redis:
    image: redis:7-alpine
    container_name: cloudplatform-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - cloudplatform

  app:
    build:
      context: ./application
      dockerfile: Dockerfile
    container_name: cloudplatform-app
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: local
      DATABASE_URL: jdbc:postgresql://postgres:5432/${DATABASE_NAME:-cloudplatform}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-app}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-app}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - cloudplatform

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  cloudplatform:
    driver: bridge
